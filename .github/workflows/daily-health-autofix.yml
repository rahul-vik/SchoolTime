name: daily-health-autofix

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  daily-health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Run daily health suite
        id: health
        run: npm run health:daily

      - name: Attempt safe dependency autofix
        if: failure()
        run: |
          npm audit fix --omit=dev || true
          npm install --package-lock-only || true

      - name: Evaluate autofix risk gate
        if: failure()
        id: risk
        run: |
          output=$(npm run --silent autofix:risk-gate)
          echo "$output"
          echo "$output" >> "$GITHUB_STEP_SUMMARY"
          safe=$(echo "$output" | sed -n 's/^safe_autofix=//p' | tail -n 1)
          risk=$(echo "$output" | sed -n 's/^risk=//p' | tail -n 1)
          echo "safe_autofix=$safe" >> "$GITHUB_OUTPUT"
          echo "risk=$risk" >> "$GITHUB_OUTPUT"

      - name: Create PR for safe dependency autofix
        if: failure() && steps.risk.outputs.safe_autofix == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/daily-autofix-${{ github.run_id }}
          title: "chore: daily automated dependency autofix"
          body: |
            ## Why
            Daily health checks failed and dependency-level automated fixes were attempted.

            ## What changed
            - Ran `npm audit fix --omit=dev`
            - Updated lockfile/dependencies where safe and possible

            ## Next step
            - Review this PR
            - Run full validation before merge
          commit-message: "chore: apply daily dependency autofix"
          delete-branch: true

      - name: Open high-risk intervention issue
        if: failure() && steps.risk.outputs.safe_autofix != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Autofix blocked by risk guardrail (${new Date().toISOString().slice(0, 10)})`;
            const body = [
              "Daily health run failed, but autonomous fix was blocked by policy.",
              "",
              `- Risk level: ${{ steps.risk.outputs.risk || 'unknown' }}`,
              `- Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              "",
              "Action required: manual triage and human-reviewed fix PR."
            ].join("\n");
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ["bug", "automated-check", "needs-human-review"]
            });

      - name: Open issue for failing health check
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Daily health check failed (${new Date().toISOString().slice(0, 10)})`;
            const body = [
              "Automated daily health run failed.",
              "",
              `- Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `- Commit: ${context.sha}`,
              "",
              "Please review logs and the optional autofix PR (if created)."
            ].join("\n");
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ["bug", "automated-check"]
            });
