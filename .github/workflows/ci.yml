name: schooltime-ci

on:
  push:
    branches: [develop, main, "release/**", "hotfix/**"]
  pull_request:
    branches: [develop, main]

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Backend/export smoke test
        run: npm run smoke:prod

      - name: Backend engine and validation tests
        run: npm run test:backend:engine

      - name: Backend validation autofix tests
        run: npm run test:backend:validation

      - name: Shared module tests
        run: npm run test:shared

      - name: Security audit (high+)
        run: npm run audit:security

      - name: Release governance guard (PR to main)
        run: npm run check:release-governance

