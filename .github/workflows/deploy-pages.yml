name: deploy-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      # Do not pass an empty VITE_API_BASE_URL — that blocks .env.production and the app falls back to localhost:8787.
      - name: Resolve VITE_API_BASE_URL
        id: vite_api
        run: |
          API="$(gh api "repos/${GITHUB_REPOSITORY}/actions/variables/VITE_API_BASE_URL" --jq .value 2>/dev/null || true)"
          API="$(echo "$API" | tr -d '\r' | xargs)"
          if [ -z "$API" ]; then
            API="$(grep -E '^VITE_API_BASE_URL=' .env.production | head -1 | cut -d= -f2- | tr -d '\r' | xargs)"
          fi
          if [ -z "$API" ]; then
            echo "::error::Set repository variable VITE_API_BASE_URL (Actions → Variables) or .env.production"
            exit 1
          fi
          case "$API" in
            */api) ;;
            *) API="${API%/}/api" ;;
          esac
          echo "Using API base: $API"
          echo "base_url=$API" >> "$GITHUB_OUTPUT"

      - name: Build frontend for GitHub Pages
        env:
          VITE_API_BASE_URL: ${{ steps.vite_api.outputs.base_url }}
        run: npm run build -- --base "/${{ github.event.repository.name }}/"

      - name: Verify production API host is in bundle
        run: |
          HOST="$(echo "${{ steps.vite_api.outputs.base_url }}" | sed -E 's|https?://([^/]+).*|\1|')"
          if ! grep -q "$HOST" dist/assets/*.js; then
            echo "::error::Built bundle missing API host $HOST — check VITE_API_BASE_URL"
            exit 1
          fi
          echo "Found API host in bundle: $HOST"

      - name: Add SPA fallback for deep links
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
